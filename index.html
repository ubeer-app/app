<style>
:root{--bg:#f4f6f1;--card:#fff;--fg:#17211b;--muted:#5d6b61;--line:#dde4da;--accent:#14532d;--accent-fg:#fff;--warn:#b45309;--bad:#b42318;--ok:#1a7f45}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;color:var(--accent)}
.brand small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:6px;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{margin:0;font-size:1.1rem}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 11px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:.86rem}
.mono{font-variant-numeric:tabular-nums}
.price{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:14px}
#map{height:260px;border-radius:12px;border:1px solid var(--line);z-index:0}
.sugg{position:relative}
.sugg ul{position:absolute;left:0;right:0;top:100%;z-index:1000;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sugg li{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.95rem}
.sugg li:hover,.sugg li.on{background:var(--bg)}
.sugg li span{color:var(--muted);font-size:.8rem}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cat{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:var(--fg)}
.cat[aria-pressed=true]{border-color:var(--accent);outline:2px solid var(--accent)}
.cat b{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:3000;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
</style>
</head>

<script>
(function(){

var SUPABASE_KEY='sb_publishable_CsSPY5QFxYrJ5J-XcnoYAA_H0t8UjzU';
var RECOVERY=/type=recovery/.test(location.hash);
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var VAPID_PUBLIC='BLYPDzPv6Aomipo6jR1MXTKEMC88AL4Z7-O1hAxMxRDMWCpWhVyjEK35hsIwDUqn_rnWF7eX2c_9cWyCGCWkt3U';

/* ---------- avisos push ---------- */
function b64ToU8(b){var p='='.repeat((4-b.length%4)%4),r=(b+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(r),o=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)o[i]=raw.charCodeAt(i);return o;}
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
async function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return isIOS()&&!isStandalone()?'ios-install':'unsupported';
  if(Notification.permission==='denied')return 'denied';
  try{
    var reg=await navigator.serviceWorker.getRegistration();
    var sub=reg&&await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted')return 'on';
  }catch(e){}
  return 'off';
}
async function ensurePush(){
  /* reativa sozinho os avisos se a permissão já foi dada (ex.: depois de sair e entrar) */
  try{
    if(!S.user||!S.profile||!(S.profile.role==='driver'||S.profile.can_drive))return;
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return;
    if(Notification.permission!=='granted')return;
    var reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    var j=sub.toJSON();
    await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
  }catch(e){}
}
async function enablePush(){
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Sem permissão não consigo avisar-te. Ativa as notificações nas definições do browser.');render();return;}
    var reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    var j=sub.toJSON();
    var r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
    if(r.error){toast(errMsg(r.error));return;}
    toast('Avisos ativados neste telemóvel.');render();
  }catch(e){toast('Não foi possível ativar os avisos: '+errMsg(e));}
}
async function testPush(){
  try{var reg=await navigator.serviceWorker.getRegistration();
    if(!reg){toast('Ativa os avisos primeiro.');return;}
    await reg.showNotification('Ubeer',{body:'Teste: os avisos estão a funcionar.',icon:'icon-192.png',tag:'teste'});
  }catch(e){toast(errMsg(e));}
}
async function disablePush(){
  try{var reg=await navigator.serviceWorker.getRegistration();var sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();}
    toast('Avisos desativados neste telemóvel.');render();}catch(e){toast(errMsg(e));}
}
function pushCard(){
  var body=h('div',{class:'col'}),c=h('div',{class:'card'},h('h2',{text:'Avisos de novos pedidos'}),body);
  pushState().then(function(st){
    body.textContent='';
    var say=function(t){body.append(h('p',{class:'small muted',text:t}));};
    if(st==='on'){say('Ativos neste telemóvel. Recebes um aviso a cada pedido novo enquanto estiveres online.');
      body.append(h('div',{class:'row'},h('button',{class:'btn ghost sm',onclick:testPush},'Testar neste telemóvel'),h('button',{class:'btn ghost sm',onclick:disablePush},'Desativar')));}
    else if(st==='off'){say('Ativa para o telemóvel tocar quando entrar um pedido, mesmo com a app fechada. Só recebes avisos enquanto estiveres online.');
      body.append(h('button',{class:'btn',onclick:enablePush},'Ativar avisos'));}
    else if(st==='denied')say('As notificações estão bloqueadas para este site. Desbloqueia nas definições do browser (cadeado junto ao endereço) e volta aqui.');
    else if(st==='ios-install')say('No iPhone, primeiro adiciona a Ubeer ao ecrã principal: botão Partilhar → Adicionar ao ecrã principal. Depois abre a Ubeer a partir desse ícone e ativa os avisos aqui.');
    else say('Este browser não suporta avisos. Experimenta o Chrome (Android) ou o Safari com a Ubeer no ecrã principal (iPhone).');
  });
  return c;
}

/* área de serviço (caixa à volta de Figueira da Foz – Montemor-o-Velho) */
var BOX={latMin:39.98,latMax:40.36,lonMin:-8.95,lonMax:-8.55};
function inArea(p){return p.lat>=BOX.latMin&&p.lat<=BOX.latMax&&p.lon>=BOX.lonMin&&p.lon<=BOX.lonMax;}

var S={user:null,profile:null,tariffs:null,places:[],rides:[],tab:'ride',cat:'eco',from:null,to:null,route:null,map:null,layer:null,users:[],ledger:[],payments:[],onlineCount:0,busy:false,chat:[],chatSeen:0};

function $(s,r){return (r||document).querySelector(s);}
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    var v=attrs[k];if(v==null||v===false)return;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x)e.append(x);});else e.append(c);}
  return e;
}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},4200);}
function eur(n){return Number(n).toFixed(2).replace('.',',')+' €';}
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function errMsg(e){return (e&&e.message)||'Ocorreu um erro. Tenta outra vez.';}
var STATUS={requested:['À procura de condutor','warn'],accepted:['Condutor a caminho','ok'],ongoing:['Em viagem','ok'],completed:['Concluída','ok'],cancelled:['Cancelada','bad']};
function split(r){var fee=Number(r.price)-Number(r.driver_earnings);
  return h('div',{class:'grid2'},h('div',null,h('div',{class:'small muted',text:'Cliente paga'}),h('b',{text:eur(r.price)})),
    h('div',null,h('div',{class:'small muted',text:'Condutor recebe'}),h('b',{text:eur(r.driver_earnings)})),
    h('div',null,h('div',{class:'small muted',text:'Ubeer (plataforma)'}),h('b',{text:eur(fee)})));}
function ledgerBox(l){
  return h('div',{class:'grid2'},
    h('div',null,h('div',{class:'small muted',text:'Ganhos (condutor)'}),h('b',{text:eur(l.earned)})),
    h('div',null,h('div',{class:'small muted',text:'Parte do molhe'}),h('b',{text:eur(l.owed)})),
    h('div',null,h('div',{class:'small muted',text:'Já entregue'}),h('b',{text:eur(l.paid)})),
    h('div',null,h('div',{class:'small muted',text:'Falta entregar'}),h('b',{class:'price',style:'color:'+(Number(l.balance)>0.004?'var(--warn)':'var(--ok)'),text:eur(l.balance)})));
}
function pill(s){var x=STATUS[s]||[s,''];return h('span',{class:'pill '+x[1],text:x[0]});}
function fmtDate(t){return new Date(t).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}

/* ---------- geometria ---------- */
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);
  return 2*R*Math.asin(Math.sqrt(x));}
function estimate(a,b){var d=hav(a,b),f=d<10?1.3:d<30?1.2:1.25;var km=d*f;
  var urban=Math.min(km,8),mins=urban/(S.tariffs?S.tariffs.speed_kmh:28)*60+(km-urban)/70*60;return {km:km,min:Math.max(3,mins),geo:null};}

/* ---------- tarifa (igual à do servidor) ---------- */
function fare(km,min,catKey){var t=S.tariffs;if(!t)return null;var c=t.categories[catKey];
  var f=Math.max(c.base+km*c.perKm+min*c.perMin,c.minFare);return Math.round((f*t.surge+Number(t.booking_fee))*100)/100;}

/* ---------- dados ---------- */
async function loadPublic(){
  var r=await Promise.all([sb.from('tariffs').select('*').eq('id',1).single(),sb.from('places').select('*').order('name'),sb.rpc('drivers_online')]);
  if(r[0].data)S.tariffs=r[0].data;S.places=r[1].data||[];S.onlineCount=r[2].data||0;
}
async function loadProfile(){
  var r=await sb.from('profiles').select('*').eq('id',S.user.id).single();S.profile=r.data;
}
async function loadRides(){
  var r=await sb.from('rides').select('*').order('created_at',{ascending:false}).limit(100);
  if(r.error)return;
  var sig=JSON.stringify((r.data||[]).map(function(x){return [x.id,x.status,x.driver_id];}));
  var changed=sig!==S.sig;S.sig=sig;S.rides=r.data||[];
  if(changed)await loadLedger();
  var a=document.activeElement;
  if(changed&&!(a&&/INPUT|SELECT/.test(a.tagName)&&$('#app').contains(a)))render();
}
async function loadLedger(){
  if(!S.profile||(S.profile.role==='passenger'&&!S.profile.can_drive))return;
  var a=await sb.rpc('driver_ledger'),b=await sb.from('payments').select('*').order('created_at',{ascending:false}).limit(100);
  S.ledger=a.data||[];S.payments=b.data||[];
}
async function loadUsers(){
  var r=await sb.from('profiles').select('*').order('created_at');S.users=r.data||[];
}
var chan;
function isDriverUser(){return !!(S.profile&&(S.profile.role==='driver'||S.profile.can_drive||S.profile.role==='admin'));}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('rides').on('postgres_changes',{event:'*',schema:'public',table:'rides'},function(){loadRides();})
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},function(){refreshOnline();})
    .on('postgres_changes',{event:'*',schema:'public',table:'driver_messages'},function(){loadChat();}).subscribe();
}
async function refreshOnline(){
  if(!S.profile||S.profile.role!=='admin')return;
  var before=JSON.stringify(S.users.map(function(u){return [u.id,u.is_online];}));
  await loadUsers();
  var after=JSON.stringify(S.users.map(function(u){return [u.id,u.is_online];}));
  var a=document.activeElement;
  if(before!==after&&S.tab==='admin'&&!(a&&/INPUT|SELECT/.test(a.tagName)&&$('#app').contains(a)))render();
}
function chatSeenKey(){return 'ubeer_chat_seen_'+(S.user?S.user.id:'');}
function unreadChat(){
  var n=0;S.chat.forEach(function(m){if(new Date(m.created_at).getTime()>S.chatSeen&&m.user_id!==S.user.id)n++;});return n;
}
function markChatSeen(){
  var last=S.chat.length?new Date(S.chat[S.chat.length-1].created_at).getTime():Date.now();
  S.chatSeen=Math.max(S.chatSeen,last);
  try{localStorage.setItem(chatSeenKey(),String(S.chatSeen));}catch(e){}
}
async function loadChat(){
  if(!isDriverUser())return;
  var r=await sb.from('driver_messages').select('*').order('created_at',{ascending:false}).limit(100);
  if(r.error)return;
  var before=S.chat.length?S.chat[S.chat.length-1].id:0;
  S.chat=(r.data||[]).reverse();
  var after=S.chat.length?S.chat[S.chat.length-1].id:0;
  if(S.tab==='chat'){markChatSeen();if(before!==after)drawChat();}
  else if(before!==after)updateTabBadge();
}
function updateTabBadge(){
  var b=document.getElementById('chatTab');if(!b)return;
  var n=unreadChat();b.textContent=n?'Chat ('+n+')':'Chat';
}
setInterval(function(){if(S.user&&!document.hidden){loadRides();loadChat();refreshOnline();}},20000);

/* ---------- autenticação ---------- */
async function boot(){
  await loadPublic();
  var s=(await sb.auth.getSession()).data.session;
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;render();}
    if(ev==='SIGNED_OUT'){S.user=null;S.profile=null;S.rides=[];S.chat=[];render();}
  });
  if(RECOVERY){render();return;}
  if(s){S.user=s.user;await afterLogin();}else render();
}
async function afterLogin(){
  await loadProfile();
  if(!S.profile){toast('Perfil não encontrado. Sai e entra de novo.');}
  S.tab=S.profile&&(S.profile.role==='driver'||S.profile.can_drive)?'drive':'ride';
  await loadRides();subscribe();
  if(S.profile&&S.profile.role==='admin')await loadUsers();
  try{S.chatSeen=+localStorage.getItem(chatSeenKey())||0;}catch(e){S.chatSeen=0;}
  await loadChat();
  await loadLedger();
  render();
  ensurePush();
}
async function doLogin(email,pass){
  var r=await sb.auth.signInWithPassword({email:email,password:pass});
  if(r.error){toast(r.error.message==='Invalid login credentials'?'Email ou palavra-passe errados.':r.error.message);return;}
  S.user=r.data.user;await afterLogin();
}
async function doRegister(name,phone,email,pass){
  var r=await sb.auth.signUp({email:email,password:pass,options:{data:{name:name,phone:phone}}});
  if(r.error){toast(r.error.message);return;}
  if(!r.data.session){toast('Conta criada. Confirma o email que te enviámos e depois entra.');return;}
  S.user=r.data.user;await afterLogin();
}
async function doForgot(email){
  if(!email){toast('Escreve o teu email.');return;}
  var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(r.error){toast(r.error.status===429?'Muitos pedidos. Espera um pouco e tenta de novo.':r.error.message);return;}
  authMode='sent';render();
}
async function doNewPass(pass){
  if(pass.length<6){toast('A palavra-passe tem de ter pelo menos 6 caracteres.');return;}
  var r=await sb.auth.updateUser({password:pass});
  if(r.error){toast(r.error.message);return;}
  RECOVERY=false;history.replaceState(null,'',location.pathname);
  toast('Palavra-passe alterada.');
  var g=(await sb.auth.getSession()).data.session;
  if(g){S.user=g.user;await afterLogin();}else{authMode='login';render();}
}
async function doLogout(){
  try{var reg=await navigator.serviceWorker.getRegistration();var sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();}}catch(e){}
  await sb.auth.signOut();
}

/* ---------- vistas ---------- */
function render(){
  var app=$('#app');app.textContent='';
  app.append(h('header',null,
    h('div',{class:'brand',style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap'},h('img',{src:'icon-192.png',alt:'',width:'38',height:'38',style:'border-radius:9px;flex:none'}),'Ubeer',h('small',{text:'Figueira da Foz · Montemor-o-Velho'})),
    S.user?h('button',{class:'btn ghost sm',onclick:doLogout},'Sair'):null));
  if(RECOVERY){app.append(resetView());return;}
  if(!S.user){app.append(authView(),infoCard());return;}
  if(!S.profile){return;}
  var isD=S.profile.role==='driver'||S.profile.can_drive;
  var isA=S.profile.role==='admin';
  var tabs=[['ride','Pedir viagem']];
  if(isD)tabs=[['drive','Condutor'],['ride','Pedir viagem']];
  if(isD||isA)tabs.push(['chat','Chat']);
  if(isA)tabs.push(['admin','Gestão']);
  if(!tabs.some(function(t){return t[0]===S.tab;}))S.tab=tabs[0][0];
  if(S.tab==='chat')markChatSeen();

/* --- sugestões de local --- */
function suggestInput(label,key){
  var inp=h('input',{placeholder:'Localidade, rua ou local',autocomplete:'off'}),ul=h('ul',{hidden:true}),timer;
  if(S[key])inp.value=S[key].name;
  function pick(p){S[key]=p;inp.value=p.name;ul.hidden=true;onPoints();}
  function show(items){ul.textContent='';if(!items.length){ul.hidden=true;return;}
    items.forEach(function(p){ul.append(h('li',{onmousedown:function(e){e.preventDefault();pick(p);}},p.name,p.sub?h('span',{text:' · '+p.sub}):null));});ul.hidden=false;}
  inp.addEventListener('input',function(){
    S[key]=null;onPoints(true);clearTimeout(timer);var q=norm(inp.value);
    if(q.length<2){ul.hidden=true;return;}
    var local=S.places.filter(function(p){return norm(p.name).indexOf(q)>-1;}).slice(0,6).map(function(p){return {name:p.name,lat:p.lat,lon:p.lon,sub:'localidade'};});
    show(local);
    timer=setTimeout(async function(){
      try{
        var u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=pt&bounded=1&viewbox='+BOX.lonMin+','+BOX.latMax+','+BOX.lonMax+','+BOX.latMin+'&accept-language=pt&q='+encodeURIComponent(inp.value);
        var r=await fetch(u);var d=await r.json();
        if(inp.value&&norm(inp.value)===q){
          var more=d.map(function(x){return {name:x.display_name.split(',').slice(0,3).join(',').trim(),lat:+x.lat,lon:+x.lon,sub:'mapa'};}).filter(inArea);
          show(local.concat(more).slice(0,9));
        }
      }catch(e){}
    },650);
  });
  inp.addEventListener('blur',function(){ul.hidden=true;
    if(!S[key]&&inp.value){var q=norm(inp.value),p=S.places.filter(function(x){return norm(x.name)===q;})[0];if(p){S[key]={name:p.name,lat:p.lat,lon:p.lon};onPoints();}}});
  var field=h('label',null,label,h('div',{class:'sugg'},inp,ul));
  if(key!=='from')return field;
  var gbtn=h('button',{class:'btn ghost sm',type:'button',onclick:function(){
    if(!navigator.geolocation){toast('Este telemóvel não permite obter a localização.');return;}
    gbtn.disabled=true;gbtn.textContent='A obter localização…';
    function done(){gbtn.disabled=false;gbtn.textContent='Usar a minha localização atual';}
    navigator.geolocation.getCurrentPosition(async function(pos){
      var lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy||0);
      if(!inArea({lat:lat,lon:lon})){done();toast('Estás fora da zona onde a Ubeer funciona.');return;}
      var nm='A minha localização';
      try{
        var r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=pt&lat='+lat+'&lon='+lon);
        var d=await r.json(),a=d.address||{};
        var rua=a.road?(a.road+(a.house_number?' '+a.house_number:'')):'';
        var loc=a.village||a.hamlet||a.suburb||a.town||a.city||'';
        var t=[rua,loc].filter(Boolean).join(', ');
        if(t)nm='A minha localização ('+t+')';
      }catch(e){}
      done();pick({name:nm,lat:lat,lon:lon});
      toast(acc>150?'Localização obtida, mas pouco precisa (±'+acc+' m). Confirma no mapa.':'Localização obtida (±'+acc+' m).');
    },function(err){
      done();
      toast(err.code===1?'Sem permissão para a localização. Ativa-a nas definições do browser para este site.':err.code===3?'Demorou demasiado. Tenta outra vez, de preferência ao ar livre.':'Não foi possível obter a localização.');
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }},'Usar a minha localização atual');
  return h('div',{style:'display:flex;flex-direction:column;gap:8px'},field,gbtn);
}
var routeSeq=0;
async function onPoints(clearOnly){
  S.route=null;
  if(clearOnly!==true&&S.from&&S.to){
    var seq=++routeSeq,est=estimate(S.from,S.to);S.route=est;
    updateEstimate();drawMap();
    try{
      var u='https://router.project-osrm.org/route/v1/driving/'+S.from.lon+','+S.from.lat+';'+S.to.lon+','+S.to.lat+'?overview=full&geometries=geojson';
      var r=await fetch(u);var d=await r.json();
      if(seq===routeSeq&&d.routes&&d.routes[0]){var rt=d.routes[0];
        S.route={km:rt.distance/1000,min:Math.max(3,rt.duration/60),geo:rt.geometry,real:true};}
    }catch(e){}

}

    h('div',{class:'grid2'},h('label',null,'Multiplicador (procura)',num('surge',t.surge,'0.05')),h('label',null,'Taxa de reserva (€)',num('fee',t.booking_fee)),
      h('label',null,'Comissão Ubeer (%)',num('comm',t.commission_pct,'1')),h('label',null,'Velocidade urbana (km/h)',num('speed',t.speed_kmh,'1'))),
    catKeys.map(function(k){var c=t.categories[k];return h('div',{class:'item'},h('b',{text:c.label}),
      h('div',{class:'grid2'},h('label',null,'Base (€)',num(k+'.base',c.base)),h('label',null,'€ / km',num(k+'.perKm',c.perKm)),
        h('label',null,'€ / min',num(k+'.perMin',c.perMin)),h('label',null,'Mínimo (€)',num(k+'.minFare',c.minFare))));}),
    h('button',{class:'btn',onclick:async function(){
      var cats={};catKeys.forEach(function(k){var c=t.categories[k];cats[k]={label:c.label,note:c.note,base:+f[k+'.base'].value,perKm:+f[k+'.perKm'].value,perMin:+f[k+'.perMin'].value,minFare:+f[k+'.minFare'].value};});
      var surge=+f.surge.value,comm=+f.comm.value,speed=+f.speed.value;
      if(!(surge>=1&&surge<=5)||!(comm>=0&&comm<=50)||!(speed>=5&&speed<=120)){toast('Valores inválidos: multiplicador 1–5, comissão 0–50, velocidade 5–120.');return;}
      var r=await sb.from('tariffs').update({surge:surge,booking_fee:+f.fee.value,commission_pct:comm,speed_kmh:speed,categories:cats}).eq('id',1).select().single();
      if(r.error)toast(errMsg(r.error));else{S.tariffs=r.data;toast('Tarifas guardadas.');}}},'Guardar tarifas'));
  app.append(tf);

  var drivers=S.users.filter(function(u){return u.role==='driver'||u.can_drive;}).length;
  var uc=h('div',{class:'card'},h('h2',{text:'Utilizadores'}),h('p',{class:'small muted',text:'Condutores: '+drivers+' de 10. Muda o papel de quem se registou para o tornar condutor, ou marca "também conduz" (por exemplo para ti).'}),
    h('div',{class:'list'},S.users.map(function(u){
      var sel=h('select',{onchange:async function(){var r=await sb.from('profiles').update({role:sel.value}).eq('id',u.id);
        if(r.error)toast(errMsg(r.error));else toast('Papel atualizado.');await loadUsers();render();}},
        [['passenger','Passageiro'],['driver','Condutor'],['admin','Administrador']].map(function(o){return h('option',{value:o[0],selected:u.role===o[0],text:o[1]});}));
      return h('div',{class:'item'},h('b',{text:u.name||u.email}),h('div',{class:'small muted',text:(u.email||'')+(u.phone?' · '+u.phone:'')}),
        u.id===S.user.id?h('div',{class:'small muted',text:'(tu)'}):sel,
        u.role==='driver'?null:h('label',{style:'flex-direction:row;align-items:center;gap:8px'},
          h('input',{type:'checkbox',style:'width:auto',checked:u.can_drive,onchange:async function(e){
            var r=await sb.from('profiles').update({can_drive:e.target.checked}).eq('id',u.id);
            if(r.error)toast(errMsg(r.error));else toast('Atualizado.');
            await loadUsers();if(u.id===S.user.id)await loadProfile();render();}}),'Também conduz'));})));
  app.append(uc);

  var pName=h('input',{placeholder:'Ex.: Largo da Feira Velha'}),pCoord=h('input',{placeholder:'40.1687, -8.7501',inputmode:'decimal'});
  var pc=h('div',{class:'card'},h('h2',{text:'Localidades'}),
    h('p',{class:'small muted',text:'No Google Maps, carrega e mantém no local e copia os dois números das coordenadas.'}),
    h('div',{class:'grid2'},h('label',null,'Nome',pName),h('label',null,'Coordenadas',pCoord)),
    h('button',{class:'btn',onclick:async function(){
      var m=pCoord.value.match(/(-?\d{1,2}\.\d+)\s*[,;]?\s*(-?\d{1,3}\.\d+)/),n=pName.value.trim();
      if(!n||!m){toast('Indica o nome e as coordenadas.');return;}
      var p={name:n,lat:+m[1],lon:+m[2]};if(!inArea(p)){toast('Fora da zona de serviço.');return;}
      var r=await sb.from('places').insert(p);if(r.error)toast(errMsg(r.error));else{toast('Localidade adicionada.');await loadPublic();render();}}},'Adicionar'),
    h('div',{class:'list'},S.places.map(function(p){return h('div',{class:'row item'},h('span',{class:'grow',text:p.name}),
      h('button',{class:'btn danger sm',onclick:async function(){var r=await sb.from('places').delete().eq('id',p.id);if(r.error)toast(errMsg(r.error));await loadPublic();render();}},'Remover'));})));
  app.append(pc);

  var dSel=h('select',null,S.ledger.map(function(l){return h('option',{value:l.driver_id,text:l.name+' · falta '+eur(l.balance)});}));
  var amt=h('input',{type:'number',step:'0.01',min:'0.01',inputmode:'decimal',placeholder:'0,00'}),note=h('input',{placeholder:'Ex.: MBWay, em mão'});
  var totalFalta=S.ledger.reduce(function(a,l){return a+Number(l.balance);},0),totalPago=S.ledger.reduce(function(a,l){return a+Number(l.paid);},0);
  var nameOf={};S.ledger.forEach(function(l){nameOf[l.driver_id]=l.name;});
  app.append(h('div',{class:'card'},h('h2',{text:'Contas correntes dos condutores'}),
    h('div',{class:'grid2'},h('div',null,h('div',{class:'small muted',text:'Por entregar ao molhe'}),h('b',{class:'price',text:eur(totalFalta)})),
      h('div',null,h('div',{class:'small muted',text:'Já entregue ao molhe'}),h('b',{class:'price',text:eur(totalPago)}))),
    h('div',{class:'list'},S.ledger.length?S.ledger.map(function(l){return h('div',{class:'item'},h('b',{text:l.name+' · '+l.rides+' viagem(ns)'}),ledgerBox(l));}):h('div',{class:'empty',text:'Ainda não há condutores.'})),
    S.ledger.length?h('div',{class:'item'},h('b',{text:'Registar entrega'}),
      h('label',null,'Condutor',dSel),h('div',{class:'grid2'},h('label',null,'Valor (€)',amt),h('label',null,'Nota',note)),
      h('button',{class:'btn',onclick:async function(){
        var v=parseFloat(String(amt.value).replace(',','.'));
        if(!(v>0)){toast('Indica o valor entregue.');return;}
        var r=await sb.from('payments').insert({driver_id:dSel.value,amount:v,note:note.value.trim()});
        if(r.error){toast(errMsg(r.error));return;}
        toast('Entrega registada.');await loadLedger();render();}},'Registar entrega')):null,
    S.payments.length?h('div',null,h('b',{class:'small',text:'Últimas entregas'}),h('div',{class:'list'},S.payments.slice(0,15).map(function(x){
      return h('div',{class:'row small'},h('span',{class:'grow muted',text:fmtDate(x.created_at)+' · '+(nameOf[x.driver_id]||'')+(x.note?' · '+x.note:'')}),h('b',{text:eur(x.amount)}),
        h('button',{class:'btn danger sm',onclick:async function(){if(!confirm('Apagar esta entrega de '+eur(x.amount)+'?'))return;
          var r=await sb.from('payments').delete().eq('id',x.id);if(r.error)toast(errMsg(r.error));await loadLedger();render();}},'Apagar'));}))):null));

  var all=S.rides.slice(0,50),done=S.rides.filter(function(r){return r.status==='completed';});
  var total=done.reduce(function(a,r){return a+Number(r.price);},0),comm=done.reduce(function(a,r){return a+Number(r.price)-Number(r.driver_earnings);},0);
  app.append(h('div',{class:'card'},h('h2',{text:'Atividade'}),
    h('div',{class:'grid2'},h('div',null,h('div',{class:'small muted',text:'Viagens concluídas'}),h('b',{text:String(done.length)})),
      h('div',null,h('div',{class:'small muted',text:'Faturado'}),h('b',{text:eur(total)})),h('div',null,h('div',{class:'small muted',text:'Comissão Ubeer'}),h('b',{text:eur(comm)}))),
    h('div',{class:'list'},all.map(function(r){return h('div',{class:'item'},h('div',{class:'row'},h('b',{class:'grow',text:r.from_name+' → '+r.to_name}),pill(r.status)),
      h('div',{class:'small muted',text:fmtDate(r.created_at)+' · '+r.passenger_name+(r.driver_name?' · '+r.driver_name:'')}),split(r),
      h('div',{class:'row'},h('button',{class:'btn danger sm',onclick:async function(){
        var msg='Apagar esta viagem ('+r.from_name+' → '+r.to_name+', '+eur(r.price)+')?'+(r.status==='completed'?' Vai também sair das contas correntes.':'')+' Não dá para desfazer.';
        if(!confirm(msg))return;
        var d=await sb.from('rides').delete().eq('id',r.id).select('id');
        if(d.error){toast(errMsg(d.error));return;}
        if(!d.data||!d.data.length){toast('Não foi possível apagar.');return;}
        toast('Viagem apagada.');S.sig='';await loadRides();}},'Apagar viagem')));}))));
}

boot();
})();
</script>
